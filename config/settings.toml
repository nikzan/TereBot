# Несекретные настройки Клона. Читают и шлюз (gateway/src/config.ts), и ядро (terebot.config).
# Здесь плейсхолдеры. Реальные ID — в config/settings.local.toml (в .gitignore):
# если он есть, читается только он, этот файл игнорируется.
# Секреты сюда не кладём: токен — только в .env.
# Где взять ID — docs/discord-setup.md, раздел 3. ID пишем строками в кавычках.

[discord]
# Тестовый сервер.
guild_id = "000000000000000000"
# Discord user ID участников, которым Клон отвечает (включая Прототипа).
whitelist = ["000000000000000000"]

# Discord-шлюз. Все поля необязательны, ниже — значения по умолчанию.
[gateway]
# Режим эха для Эхо-теста: Клон проигрывает в канал каждого говорящего с задержкой.
echo = true
echo_delay_ms = 2000
# Через сколько секунд Клон выходит из канала, где не осталось людей.
autoleave_s = 30
# Участник говорит, а кадров от него нет дольше этого порога, — переподписка.
watchdog_silence_ms = 3000
# Столько неудачных переподписок за 60 с — и шлюз переподключается к каналу.
watchdog_max_resubscribes = 3

# Запись раздельных потоков участников из whitelist в WAV.
[recording]
enabled = true
# Относительно корня репозитория. data/ в .gitignore.
dir = "data/recordings"

# Политика Диалога: кого Клон слушает и когда замолкает. Все поля необязательны,
# ниже — значения по умолчанию.
[dialogue]
# Варианты Слова-вызова. Сравниваются нечётко, без учёта регистра, пунктуации и ё.
wake_words = ["теребот"]
# Порог сходства rapidfuzz.fuzz.ratio, 0–100.
wake_threshold = 80
# Слова, которые не считаются Словом-вызовом, даже если похожи: имя и прозвища Прототипа.
wake_blocklist = ["терем", "терема", "терему", "теремом", "тереме", "терешкин", "терешкина", "терешкину", "терешкиным", "терешкине"]
# Окно ожидания: через столько секунд тишины после ответа Клона Диалог заканчивается.
window_s = 20
# Столько миллисекунд непрерывной речи Собеседника — и Клон замолкает.
barge_in_ms = 1000

# Связь шлюза и ядра. Все поля необязательны, ниже — значения по умолчанию.
[core]
# Ядро — WebSocket-сервер на 127.0.0.1:port, шлюз подключается к нему (если эхо выключено).
port = 8765

# Восприятие речи в ядре.
[speech]
# Вероятность Silero VAD, выше которой звук считается речью.
vad_threshold = 0.5
# Вероятность Smart Turn, выше которой участник договорил.
turn_threshold = 0.5
# Столько миллисекунд тишины после речи — и Smart Turn решает, закончена ли Реплика.
silence_ms = 200
# Паузы короче этого не обнуляют длительность непрерывной речи (для перебивания).
continuity_ms = 300
# Дольше этого после конца речи Реплика продолжения не ждёт.
max_pause_ms = 1500
# Реплика длиннее стольких секунд распознаётся частями.
asr_max_s = 20

# LLM. Ядро запускает llama-server само, если на порту никто не отвечает.
[llm]
# Путь к GGUF; ~ и * раскрываются.
model = "~/.cache/huggingface/hub/models--unsloth--Qwen3.5-4B-GGUF/snapshots/*/Qwen3.5-4B-Q4_K_M.gguf"
port = 8080
# Окно llama-server (-c) и бюджет промпта в нём; остаток — на ответ.
ctx_size = 4096
context_tokens = 3000
max_tokens = 256
# Столько секунд без ответа от LLM — сбой ответа.
timeout_s = 30

# Голос. Либо zero-shot: model + ref_audio (+ ref_text), либо дообученный: model + speaker.
[voice]
model = "mlx-community/Qwen3-TTS-12Hz-1.7B-Base-8bit"
# Относительно корня репозитория. Без ref_text текст референса читается из <ref_audio>.txt
# с тем же именем (ref.wav → ref.txt).
ref_audio = "data/bench/reference/ref.wav"
# speaker = "prototype"
# Секунд звука в чанке стриминга и лимит кэша MLX — как в бенчмарке этапа 3.
streaming_interval = 0.5
cache_limit_gb = 1.0
# Фраза ответа не короче и (если нет точки) не длиннее стольких символов.
min_phrase_chars = 20
max_phrase_chars = 200
# Приветствие при входе в канал — случайная строка отсюда.
greetings = ["Всем привет!", "Здарова.", "О, привет всем."]

# Журнал Сессии: data/sessions/<Сессия>/journal.jsonl.
[journal]
# Тексты Реплик и ответов, решения Политики.
transcripts = true
# Задержка по этапам, память раз в секунду, сводка в конце Сессии.
metrics = true
