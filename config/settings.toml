# Несекретные настройки Клона. Читают и шлюз (gateway/src/config.ts), и ядро (terebot.config).
# Здесь плейсхолдеры. Реальные ID — в config/settings.local.toml (в .gitignore):
# если он есть, читается только он, этот файл игнорируется.
# Секреты сюда не кладём: токен — только в .env.
# Где взять ID — docs/discord-setup.md, раздел 3. ID пишем строками в кавычках.

[discord]
# Тестовый сервер.
guild_id = "000000000000000000"
# Discord user ID участников, которым Клон отвечает (включая Прототипа).
whitelist = ["000000000000000000"]

# Discord-шлюз. Все поля необязательны, ниже — значения по умолчанию.
[gateway]
# Режим эха для Эхо-теста: Клон проигрывает в канал каждого говорящего с задержкой.
echo = true
echo_delay_ms = 2000
# Через сколько секунд Клон выходит из канала, где не осталось людей.
autoleave_s = 30
# Участник говорит, а кадров от него нет дольше этого порога, — переподписка.
watchdog_silence_ms = 3000
# Столько неудачных переподписок за 60 с — и шлюз переподключается к каналу.
watchdog_max_resubscribes = 3

# Запись раздельных потоков участников из whitelist в WAV.
[recording]
enabled = true
# Относительно корня репозитория. data/ в .gitignore.
dir = "data/recordings"
