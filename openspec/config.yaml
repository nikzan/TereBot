schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект TereBot — локальный голосовой Клон Прототипа для приватного Discord-сервера на русском.
  Источники истины (читать перед планированием, не копировать в артефакты):
  - CONTEXT.md — глоссарий; в артефактах использовать только его термины (Клон, Прототип, Голос, Паспорт,
    Реплика, Слово-вызов, Собеседник, Диалог, Сессия, Политика Диалога, Журнал Сессии, Эхо-тест, Слепой тест).
  - docs/PLAN.md — принятые решения, пороги и этапы; один change соответствует одному этапу или его части.
  - docs/adr/ — архитектурные решения; не предлагать отвергнутые там варианты.
  - docs/REFERENCES.md — первоисточники и проверенные версии пакетов и моделей.
  Ограничения: Клон работает только на MacBook Pro M1 Pro 16 ГБ (MPS/CPU) без внешних API;
  обучение — на отдельном CUDA-кластере, код для него только в scripts/. Python через uv, Node-шлюз в gateway/.

rules:
  proposal:
    - Ссылаться на этап docs/PLAN.md, который реализует change
    - Явно перечислять, что вне рамок change
  tasks:
    - Каждая задача — не больше ~2 часов работы и с проверяемым результатом
    - Задачи, которые выполняет только владелец (создание Discord-бота, запись с Прототипом, Слепой тест), помечать префиксом «[владелец]»
    - Последняя группа задач — проверка критерия «готово» этапа из docs/PLAN.md
