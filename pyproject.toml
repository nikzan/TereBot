[project]
name = "terebot"
version = "0.1.0"
description = "Локальный голосовой Клон для приватного Discord-сервера"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
# Зависимости для обучения на кластере (scripts/), ставятся через `uv sync --group train`.
train = [
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    # sft_12hz.py требует flash_attention_2; без пакета flash-attn transformers берёт ядро
    # kernels-community/flash-attn с HF через `kernels`: 0.9 не понимает новую раскладку сборок
    # на хабе, 0.13+ требует huggingface-hub>=1.3, а transformers 4.57 — <1.0. Готовые
    # сборки там — до torch 2.12, а torchaudio 2.11.0 из qwen-tts собран под torch 2.11.
    "torch==2.11.*; sys_platform == 'linux'",
    "kernels==0.12.3; sys_platform == 'linux'",
    "scipy>=1.18.1",
    "soundfile>=0.13.1",
]
# Бэкенды Голоса для бенчмарка (scripts/bench_voice.py). Взаимоисключающие, запуск — `uv run --group <g>`.
tts-qwen-torch = [
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "psutil>=7.2.2",
    "soundfile>=0.13.1",
]
tts-mlx = [
    "mlx-audio==0.5.9",
    "psutil>=7.2.2",
    "soundfile>=0.13.1",
]
tts-chatterbox = [
    "chatterbox-tts==0.1.7",
    # resemble-perth (водяной знак Chatterbox) импортирует pkg_resources, которого нет в новых setuptools.
    "setuptools<81",
    "psutil>=7.2.2",
    "soundfile>=0.13.1",
]
# Метрики качества Голоса (terebot.voice_eval).
eval = [
    "onnx-asr[cpu,hub]==0.12.0",
    "speechbrain==1.1.2",
    "psutil>=7.2.2",
    "soundfile>=0.13.1",
]
# Python-ядро Клона (python -m terebot.core): Голос на MLX, распознавание, VAD, Smart Turn.
core = [
    "httpx>=0.28.1",
    "mlx-audio==0.5.9",
    "onnx-asr[cpu,hub]==0.12.0",
    "websockets>=17.2",
    "psutil>=7.2.2",
    "num2words>=0.5.14",
    "scipy>=1.18.1",
    "soundfile>=0.13.1",
]
# Конвейер датасета Голоса (scripts/dataset/), запуск — `uv run --group data`.
data = [
    "onnx-asr[cpu,hub]==0.12.0",
    "prompt-toolkit==3.0.53",
    "pyloudnorm==0.2.0",
    "silero-vad==6.2.3",
    "soundfile>=0.13.1",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["gateway", "openspec", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ — не пакет; так тесты импортируют bench_voice.
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers"]

[tool.uv]
# qwen-tts держит transformers==4.57.3, mlx-audio — >=5.14, chatterbox-tts — ==5.2.0 и torch==2.6.0
# (speechbrain требует torch>=2.7.1), поэтому группы не ставятся вместе. Ядро (core) — на mlx-audio,
# а train — для CUDA-кластера.
conflicts = [
    [{ group = "tts-qwen-torch" }, { group = "tts-mlx" }, { group = "tts-chatterbox" }],
    [{ group = "core" }, { group = "tts-qwen-torch" }],
    [{ group = "core" }, { group = "tts-chatterbox" }],
    [{ group = "core" }, { group = "train" }],
    [{ group = "train" }, { group = "tts-mlx" }],
    [{ group = "train" }, { group = "tts-chatterbox" }],
    [{ group = "eval" }, { group = "tts-chatterbox" }],
]
